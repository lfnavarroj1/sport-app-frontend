<a class="skip-link" href="#main-content" (click)="skipToMain($event, main)">
  {{ 'app.skipToContent' | translate }}
</a>

<mat-toolbar role="banner">
  <span class="app-name">{{ 'app.name' | translate }}</span>
  <nav class="app-nav" [attr.aria-label]="'app.navigation' | translate">
    <a
      mat-button
      routerLink="/iniciar-sesion"
      routerLinkActive="app-nav__active"
      ariaCurrentWhenActive="page"
    >
      {{ 'app.nav.login' | translate }}
    </a>
  </nav>
</mat-toolbar>

<main #main id="main-content" tabindex="-1">
  <router-outlet />
</main>
