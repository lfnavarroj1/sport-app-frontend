<mat-card appearance="outlined" class="login">
  <mat-card-header>
    <mat-card-title>
      <h1>{{ 'login.title' | translate }}</h1>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (notAvailable()) {
      <p class="login__notice" role="status" data-testid="login-not-available">
        {{ 'login.notAvailable' | translate }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="login__form">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.fields.email' | translate }}</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" required />
        <mat-error><app-field-error [control]="form.controls.email" /></mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.fields.password' | translate }}</mat-label>
        <input
          matInput
          [type]="passwordVisible() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="'login.fields.showPassword' | translate"
          [attr.aria-pressed]="passwordVisible()"
        >
          <mat-icon aria-hidden="true">{{
            passwordVisible() ? 'visibility_off' : 'visibility'
          }}</mat-icon>
        </button>
        <mat-error><app-field-error [control]="form.controls.password" /></mat-error>
      </mat-form-field>

      <button mat-flat-button type="submit" class="login__submit">
        {{ 'login.submit' | translate }}
      </button>
    </form>

    <p class="login__register">
      {{ 'login.noAccount' | translate }}
      <a routerLink="/registro">{{ 'login.createAccount' | translate }}</a>
    </p>
  </mat-card-content>
</mat-card>
