# Publicación de la imagen web en el Artifact Registry de producción (ADR-022).
# - Solo tags vX.Y.Z cuyo commit pertenece a main.
# - Construye una vez, prueba esa imagen con deploy/docker/smoke-test.sh y publica la
#   misma imagen, sin reconstruirla. El digest queda en el resumen del job.
# - No despliega: Cloud Run lo actualiza Terraform de la plataforma con el digest.
# - Sin las variables del Environment `production` informa BLOQUEADO y no publica;
#   la comprobación de main y la prueba del contenedor se ejecutan igual.
# Nunca se usan llaves JSON: solo OIDC + Workload Identity Federation.
name: release-web

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar tag y pertenencia a main
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::El tag '$TAG' no tiene el formato vX.Y.Z[-pre]; no se publica."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El commit del tag $TAG ($GITHUB_SHA) no pertenece a main; no se publica."
            exit 1
          fi
          echo "Tag $TAG en main ($GITHUB_SHA)."

      - name: Construir la imagen una sola vez
        run: |
          docker build -t "sportapp/web:${TAG}" \
            --build-arg "VERSION=${TAG#v}" --build-arg "REVISION=${GITHUB_SHA}" .

      - name: Prueba de humo del contenedor
        run: bash deploy/docker/smoke-test.sh "sportapp/web:${TAG}"

      - id: gate
        name: Verificar variables del Environment production
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DELIVERY_SERVICE_ACCOUNT }}
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          REGISTRY_HOST: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ] && [ -n "$REGISTRY" ] && [ -n "$REGISTRY_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BLOQUEADO: faltan variables del Environment production; no se publicó la imagen."
            {
              echo "## BLOQUEADO: publicación de la imagen web"
              echo "Faltan variables del Environment production: GCP_WORKLOAD_IDENTITY_PROVIDER,"
              echo "GCP_DELIVERY_SERVICE_ACCOUNT, GCP_ARTIFACT_REGISTRY y GCP_ARTIFACT_REGISTRY_HOST."
              echo "La imagen se construyó y pasó la prueba de humo, pero no se publicó."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: auth
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DELIVERY_SERVICE_ACCOUNT }}
          token_format: access_token

      - if: steps.gate.outputs.ready == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Publicar la imagen probada
        if: steps.gate.outputs.ready == 'true'
        env:
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
        run: |
          set -euo pipefail
          docker tag "sportapp/web:${TAG}" "${REGISTRY}/web:${TAG}"
          docker push "${REGISTRY}/web:${TAG}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${REGISTRY}/web:${TAG}")"
          {
            echo "## Imagen web publicada"
            echo "| Componente | Tag | Digest |"
            echo "| --- | --- | --- |"
            echo "| web | ${TAG} | ${digest} |"
          } >> "$GITHUB_STEP_SUMMARY"
