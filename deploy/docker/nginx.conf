# nginx del frontend web. Usuario sin privilegios (101) y raíz de solo lectura:
# todo lo que se escribe (PID, temporales, app-config.json) vive en /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Sin cuerpos, consultas ni encabezados: solo método, ruta, estado y tamaño.
    log_format web '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout web;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Detrás de Cloud Run o de un Service el puerto 8080 no es el público.
        absolute_redirect off;

        # Sonda de Kubernetes: no depende de la aplicación ni de la configuración.
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Generado por deploy/docker/start.sh al arrancar.
        location = /app-config.json {
            root /tmp/sportapp;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        # Archivos con hash del build de Angular (outputHashing: all).
        location ~ "-[A-Z0-9]{8}\.[a-z0-9]+$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Archivos sin hash (i18n, favicon) se revalidan; el resto de rutas es la SPA.
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
