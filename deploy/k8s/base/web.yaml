# Aplicación web (Angular servido por nginx). La plataforma aporta el namespace, el
# ConfigMap sportapp-runtime, el tag de la imagen y el acceso desde el equipo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        # Usuario y grupo nginx de la imagen nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      containers:
        - name: app
          image: sportapp/web
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: { name: sportapp-runtime, key: APP_ENV }
            - name: BFF_WEB_BASE_URL
              valueFrom:
                configMapKeyRef: { name: sportapp-runtime, key: BFF_WEB_BASE_URL }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # PID, temporales de nginx y app-config.json generado al arrancar.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - { name: http, port: 80, targetPort: http }
